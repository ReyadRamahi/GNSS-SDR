[GNSS-SDR]

; ================================================================
; RTLSDR GPS L1 C/A config for hft02
; User: alexgu2
; SDR path: RTLSDR over SoapyRemote
; ================================================================

GNSS-SDR.internal_fs_sps=2048000
GNSS-SDR.telecommand_enabled=false

; ------------------------
; Signal source
; ------------------------
SignalSource.implementation=Osmosdr_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=2048000
SignalSource.freq=1575420000
SignalSource.gain=42
SignalSource.AGC_enabled=false
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.dump=false

; IMPORTANT:
; Direct RTLSDR USB access has permission issues.
; Use the remote Soapy path instead.
SignalSource.osmosdr_args=soapy=0,driver=remote,remote=tcp://172.17.0.1:55132,remote:driver=rtlsdr,remote:serial=00000001

; ------------------------
; Signal conditioner
; ------------------------
SignalConditioner.implementation=Signal_Conditioner

DataTypeAdapter.implementation=Pass_Through
DataTypeAdapter.item_type=gr_complex

; 51 taps mattered in previous testing.
; The 5-tap default produced zero acquisitions.
InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=51
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.45
InputFilter.band2_begin=0.55
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=2048000
InputFilter.IF=0
InputFilter.dump=false

Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex

; ------------------------
; Channels
; ------------------------
Channels_1C.count=12
Channels.in_acquisition=4

Channel.signal=1C
Channel_1C.implementation=GPS_L1_CA_Channel
Channel_1C.item_type=gr_complex

; ------------------------
; Acquisition
; ------------------------
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.threshold=2.6
Acquisition_1C.doppler_max=7500
Acquisition_1C.doppler_step=250
Acquisition_1C.bit_transition_flag=false
Acquisition_1C.use_CFAR_algorithm=false
Acquisition_1C.dump=false

; ------------------------
; Tracking
; ------------------------
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=35.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.enable_fll_pull_in=true
Tracking_1C.fll_bw_hz=10.0
Tracking_1C.extend_correlation_symbols=10
Tracking_1C.dump=false

; ------------------------
; Telemetry decoder
; ------------------------
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

; ------------------------
; Observables
; ------------------------
Observables.implementation=Hybrid_Observables
Observables.dump=true

; ------------------------
; PVT / position solution
; ------------------------
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=1000
PVT.display_rate_ms=500
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.flag_averaging=false
PVT.flag_nmea_tty_port=false
PVT.nmea_dump_filename=/home/alexgu2/gnss/research_runs_2026-04-24_2028/out/track10_g42.nmea
PVT.dump=false

; ------------------------
; Output
; ------------------------
OutputFilter.implementation=Null_Sink_Output_Filter
Tracking_1C.pll_bw_narrow_hz=5.0
Tracking_1C.dll_bw_narrow_hz=0.5
Tracking_1C.enable_fll_steady_state=false
Tracking_1C.early_late_space_narrow_chips=0.1
Tracking_1C.max_lock_fail=100
Tracking_1C.cn0_min=22
Observables.dump_filename=/home/alexgu2/gnss/research_runs_2026-04-24_2028/out/track10_g42_observables.dat
TelemetryDecoder_1C.dump_crc_stats=true
TelemetryDecoder_1C.dump_crc_stats_filename=/home/alexgu2/gnss/research_runs_2026-04-24_2028/out/track10_g42_crc
PVT.elevation_mask=5
PVT.output_enabled=true
PVT.nmea_output_file_enabled=true
PVT.rtk_trace_level=3
